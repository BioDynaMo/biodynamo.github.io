# This Github Actions Workflow checks out the latest version of the BioDynaMo
# master branch and builds biodynamo.github.io with the build target `website`.
# Internally it relies on the Gatsby framework to generate the static files
name: Website CI

on:
  schedule:
    # Every day at 3 am
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to GitHub Pages (master only); leave off to test the build'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: website-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
    - name: Checkout BioDynaMo
      uses: actions/checkout@v6
      with:
        repository: BioDynaMo/biodynamo
        ref: master
        fetch-depth: 0
        path: biodynamo
        persist-credentials: false

    - name: Cache pyenv
      uses: actions/cache@v5
      id: pyenv-cache
      with:
        path: ~/.pyenv
        key: ubuntu-22.04-${{ runner.arch }}-pyenv-3.9.1-${{ hashFiles('biodynamo/util/installation/ubuntu-22.04/prerequisites.sh', 'biodynamo/util/installation/ubuntu-22.04/pip_packages.txt') }}

    - name: Cache Third Party Packages
      uses: actions/cache@v5
      with:
        path: biodynamo/build/third_party
        key: ubuntu-22.04-${{ runner.arch }}-third-party-${{ hashFiles('biodynamo/cmake/external/SHA256Digests.cmake') }}

    - name: Install prerequisites
      shell: bash
      run: |
        # The upstream 22.04 script installs system dependencies before building
        # shared Python 3.9.1, and reuses the restored pyenv installation.
        prerequisites=biodynamo/util/installation/ubuntu-22.04/prerequisites.sh
        # CMake 3.19.3 release assets use "Linux", not "linux". Keep this
        # compatibility fix until the upstream prerequisite script is corrected.
        sed -i 's/cmake-${CMAKE_VER}-linux-x86_64.sh/cmake-${CMAKE_VER}-Linux-x86_64.sh/' "$prerequisites"
        bash -e "$prerequisites" all

    - name: Build website
      working-directory: biodynamo
      shell: bash
      run: |
        export PYENV_ROOT="$HOME/.pyenv"
        export PATH="$PYENV_ROOT/bin:$PATH"
        eval "$(pyenv init --path)"
        eval "$(pyenv init -)"
        pyenv shell 3.9.1
        python -m pip install lxml_html_clean
        cmake \
          -Dwebsite=on \
          -Dtest=off \
          -Dnotebooks=on \
          -Dnuma=off \
          -B build
        cd build
        make
        make website

    # Get a copy of the .github folder
    - name: Checkout biodynamo.github.io
      uses: actions/checkout@v6
      with:
        fetch-depth: 0
        path: biodynamo.github.io
        persist-credentials: false

    # Since the deploy step below deletes all website files first, before adding
    # the updated files, it will also delete the .github folder
    # We copy the .github folder to the publish_dir, so that it will be re-added
    # once we deploy
    - name: Copy .github folder
      run: cp -R biodynamo.github.io/.github biodynamo/build/website/public

    - name: Deploy GitHub Pages
      if: github.ref == 'refs/heads/master' && (github.event_name == 'schedule' || inputs.publish)
      uses: peaceiris/actions-gh-pages@v4
      with:
        deploy_key: ${{ secrets.ACTIONS_DEPLOY_KEY }}
        publish_branch: master
        user_name: 'github-actions[bot]'
        user_email: 'bdm.travis@cern.ch'
        publish_dir: biodynamo/build/website/public
        exclude_assets: ''
